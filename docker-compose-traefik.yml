# ALPHA/PROD deployment overlay — used with the base docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose-traefik.yml up -d
#
# Carries only what differs on a Traefik-fronted server: routing labels,
# external shared networks, /srv data volumes. Images, env, depends_on and
# base volumes come from docker-compose.yml.
#
# Network topology: only the edge services (orchestrator, sr-email, sr-next)
# are attached to the Traefik `web` network. Backend rs-* modules are
# internal-only (sr-internal + db) — they are reached exclusively through the
# orchestrator.
name: sr-server

services:
  redis:
    volumes:
      - /srv/data/sr-server/redis:/data
    networks:
      - sr-internal

  orchestrator:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sr-orc.rule=Host(`${SR_PUBLIC_HOST}`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.sr-orc.priority=80"
      - "traefik.http.routers.sr-orc.tls.certresolver=letsencrypt"
      - "traefik.http.services.sr-orc.loadbalancer.server.port=${SR_ORCHESTRATOR_PORT}"
      - "traefik.http.routers.sr-orc-query.rule=Host(`${SR_PUBLIC_HOST}`) && Path(`/query`)"
      - "traefik.http.routers.sr-orc-query.priority=70"
      - "traefik.http.routers.sr-orc-query.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sr-orc-query.service=sr-orc"
    networks:
      - sr-internal
      - db
      - web

  rs-users:
    networks:
      - sr-internal
      - db

  rs-notes:
    networks:
      - sr-internal
      - db

  rs-groups:
    networks:
      - sr-internal
      - db

  rs-connections:
    networks:
      - sr-internal
      - db

  rs-notifications:
    networks:
      - sr-internal
      - db

  rs-notifications-cron:
    networks:
      - sr-internal
      - db

  rs-responses:
    networks:
      - sr-internal
      - db

  sr-email:
    volumes:
      - /srv/data/sr-server/emails:${EMAIL_STORE_DIR}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sr-email.rule=Host(`${SR_PUBLIC_HOST}`) && PathPrefix(`/api/email/`)"
      - "traefik.http.routers.sr-email.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sr-email.priority=90"
      - "traefik.http.services.sr-email.loadbalancer.server.port=${SR_EMAIL_PORT}"
    networks:
      - sr-internal
      - web

  sr-next:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sr-next.rule=Host(`${SR_PUBLIC_HOST}`)"
      - "traefik.http.routers.sr-next.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sr-next.priority=1"
      - "traefik.http.services.sr-next.loadbalancer.server.port=${SR_NEXT_PORT}"
      # Next.js internal API routes — must match before the orchestrator's
      # wildcard /api/ rule so these are served by sr-next, not proxied.
      - "traefik.http.routers.sr-next-build-id.rule=Host(`${SR_PUBLIC_HOST}`) && PathPrefix(`/api/build-id`)"
      - "traefik.http.routers.sr-next-build-id.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sr-next-build-id.priority=100"
    networks:
      - sr-internal
      - web

networks:
  sr-internal:
    name: sr-internal
  db:
    name: infra-db
    external: true
  web:
    name: infra-web
    external: true