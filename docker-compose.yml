name: sr-server
# Base = the deployable app stack, all services from ghcr.io images.
# Environment-specific infrastructure (postgres, S3, mail, proxy) lives in
# overlays: docker-compose.dev.yml (dev), docker-compose-traefik.yml (alpha/prod).
# See docker-compose-postgres.yml for a standalone shared-postgres example.
services:
  redis:
    container_name: sr-redis
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server

  orchestrator:
    container_name: sr-orchestrator
    image: ghcr.io/socialroots/orchestrator:${VERSION}
    ports:
      - "${SR_ORCHESTRATOR_PORT}:${SR_ORCHESTRATOR_PORT}"
    environment: &orchestrator_env
      ENV: ${ENV}
      PORT: ${SR_ORCHESTRATOR_PORT}
      SR_API_PREFIX: ${SR_API_PREFIX}
      SR_SESSION_TTL_HOURS: ${SR_SESSION_TTL_HOURS}
      LOCALENV: ${LOCALENV}
      # DB/redis hosts are env-driven: dev overlay runs containers
      # (sr-postgres, sr-redis); alpha/prod point at external ones.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_EXPIRATION: ${REDIS_EXPIRATION}
      DISABLE_CACHE: ${DISABLE_CACHE}
      PROFILING_ENABLED: ${PROFILING_ENABLED}
      ROOTSHOOT_USERS_SERVICE: "http://sr-rs-users:${ROOTSHOOT_USERS_SERVICE_PORT}"
      ROOTSHOOT_GROUPS_SERVICE: "http://sr-rs-groups:${ROOTSHOOT_GROUPS_SERVICE_PORT}"
      ROOTSHOOT_NOTES_SERVICE: "http://sr-rs-notes:${ROOTSHOOT_NOTES_SERVICE_PORT}"
      ROOTSHOOT_RESPONSES_SERVICE: "http://sr-rs-responses:${ROOTSHOOT_RESPONSES_SERVICE_PORT}"
      ROOTSHOOT_NOTIFICATIONS_SERVICE: "http://sr-rs-notifications:${ROOTSHOOT_NOTIFICATIONS_SERVICE_PORT}"
      ROOTSHOOT_CONNECTIONS_SERVICE: "http://sr-rs-connections:${ROOTSHOOT_CONNECTIONS_SERVICE_PORT}"
      SR_EMAIL_GATEWAY: "http://sr-email:${SR_EMAIL_PORT}"
      WEB_APP_HOST: ${WEB_APP_HOST}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      SR_INTERNAL_TOKEN: ${SR_INTERNAL_TOKEN}
    command: /go/bin/api
    depends_on:
      - redis

  rs-users:
    container_name: sr-rs-users
    image: ghcr.io/socialroots/rs-users:${VERSION}
    environment: &service_env
      <<: *orchestrator_env
      API_PORT: ${ROOTSHOOT_USERS_SERVICE_PORT}
      POSTGRES_DB_NAME: ${DB_NAME_USERS}
      PASSWORD_COST: ${PASSWORD_COST}
      SIGNING_KEY: ${SIGNING_KEY}
      # S3 config is env-driven: point S3_HOST/AWS_* at AWS S3 today, or at a
      # future local MinIO (see docker-compose.minio.yml) without compose changes.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_IMAGE_BUCKET_NAME: ${MINIO_DEFAULT_BUCKET}
      AWS_S3_ENDPOINT: ${S3_HOST}
      SLACK_INCOMING_WEB_HOOK: ${SLACK_INCOMING_WEB_HOOK}
      REPLYTO: "${REPLYTO}"
      MAILGUN_ADDRESS: "${MAILGUN_ADDRESS}"
      MAILGUN_USERNAME: "${MAILGUN_USERNAME}"
      MAILGUN_PASSWORD: "${MAILGUN_PASSWORD}"
      MAILGUN_HOST: "${MAILGUN_HOST}"
    command: /go/bin/web
    depends_on:
      - orchestrator

  rs-notes:
    container_name: sr-rs-notes
    image: ghcr.io/socialroots/rs-notes:${VERSION}
    environment:
      <<: *service_env
      API_PORT: ${ROOTSHOOT_NOTES_SERVICE_PORT}
      POSTGRES_DB_NAME: ${DB_NAME_NOTES}
      EMAIL_WHITELIST: "${EMAIL_WHITELIST}"
    command: /go/bin/web
    depends_on:
      - orchestrator

  rs-groups:
    container_name: sr-rs-groups
    image: ghcr.io/socialroots/rs-groups:${VERSION}
    environment:
      <<: *service_env
      API_PORT: ${ROOTSHOOT_GROUPS_SERVICE_PORT}
      POSTGRES_DB_NAME: ${DB_NAME_GROUPS}
    command: /go/bin/web
    depends_on:
      - orchestrator

  rs-connections:
    container_name: sr-rs-connections
    image: ghcr.io/socialroots/rs-connections:${VERSION}
    environment:
      <<: *service_env
      API_PORT: ${ROOTSHOOT_CONNECTIONS_SERVICE_PORT}
      POSTGRES_DB_NAME: ${DB_NAME_CONNECTIONS}
    command: /go/bin/web
    depends_on:
      - orchestrator

  rs-notifications:
    container_name: sr-rs-notifications
    image: ghcr.io/socialroots/rs-notifications:${VERSION}
    environment:
      <<: *service_env
      API_PORT: ${ROOTSHOOT_NOTIFICATIONS_SERVICE_PORT}
      POSTGRES_DB_NAME: ${DB_NAME_NOTIFICATIONS}
      LOCAL_OVERRIDES: ""
    command: /go/bin/web
    depends_on:
      - orchestrator

  rs-notifications-cron:
    container_name: sr-rs-notifications-cron
    image: ghcr.io/socialroots/rs-notifications:${VERSION}
    environment:
      <<: *service_env
      POSTGRES_DB_NAME: ${DB_NAME_NOTIFICATIONS}
      LOCAL_OVERRIDES: ""
    command: sh -c "while true; do /go/bin/cron; sleep 300; done"
    depends_on:
      - orchestrator
    restart: unless-stopped

  rs-responses:
    container_name: sr-rs-responses
    image: ghcr.io/socialroots/rs-responses:${VERSION}
    environment:
      <<: *service_env
      API_PORT: ${ROOTSHOOT_RESPONSES_SERVICE_PORT}
      POSTGRES_DB_NAME: ${DB_NAME_RESPONSES}
    command: /go/bin/web
    depends_on:
      - orchestrator

  sr-email:
    container_name: sr-email
    image: ghcr.io/socialroots/sr-email:${VERSION}
    environment:
      ENV: ${ENV}
      API_PORT: ${SR_EMAIL_PORT}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY}
      ROOTSHOOT_RESPONSES_SERVICE: "http://sr-rs-responses:${ROOTSHOOT_RESPONSES_SERVICE_PORT}"
      SR_INTERNAL_TOKEN: ${SR_INTERNAL_TOKEN}
      CRON_INTERVAL: ${SR_EMAIL_CRON_INTERVAL}
      EMAIL_STORE_DIR: ${EMAIL_STORE_DIR}
      # Outbound SMTP relay + dev whitelist (settings/esp.go). Root .env
      # points these at the dev mailpit (sr-mailhog) or a real ESP in prod.
      MAILGUN_ADDRESS: ${MAILGUN_ADDRESS}
      MAILGUN_USERNAME: ${MAILGUN_USERNAME}
      MAILGUN_PASSWORD: ${MAILGUN_PASSWORD}
      MAILGUN_HOST: ${MAILGUN_HOST}
      EMAIL_WHITELIST: ${EMAIL_WHITELIST}
    volumes:
      - email_data:${EMAIL_STORE_DIR}
    restart: unless-stopped
    depends_on:
      # sr-email only calls RS-RESPONSES (forwarding). It does not talk to
      # rs-users/rs-notes — that dependency was cargo-culted and could
      # deadlock startup if either service is slow to come up.
      - rs-responses

  sr-next:
    container_name: sr-next
    restart: unless-stopped
    image: ghcr.io/socialroots/sr-next:${VERSION}
    environment:
      # Runtime config for the web app — read at container BOOT, not baked
      # into the image at build time. Consumed via publicRuntimeConfig in
      # modules/SR-NEXT/next.config.js (see sr-next/.env.model).
      HOSTNAME: "0.0.0.0"
      POSTHOG_TOKEN: ${POSTHOG_TOKEN}
      POSTHOG_HOST: ${POSTHOG_HOST}
      POLL_INTERVAL: ${POLL_INTERVAL}
      CONNECT_ORG_FORM_LINK: ${CONNECT_ORG_FORM_LINK}
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator


volumes:
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  email_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/emails


